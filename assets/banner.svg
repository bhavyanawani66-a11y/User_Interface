
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     width="1200" height="300"
     viewBox="0 0 1200 300">

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#111110"/>
      <stop offset="55%" stop-color="#1D1B18"/>
      <stop offset="100%" stop-color="#0C0C0B"/>
    </linearGradient>

    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F3DCA6"/>
      <stop offset="50%" stop-color="#C6A15B"/>
      <stop offset="100%" stop-color="#98713B"/>
    </linearGradient>

    <linearGradient id="photoRing" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F5E2B4"/>
      <stop offset="100%" stop-color="#A47C40"/>
    </linearGradient>

    <radialGradient id="glow">
      <stop offset="0%" stop-color="#C6A15B" stop-opacity="0.13"/>
      <stop offset="100%" stop-color="#C6A15B" stop-opacity="0"/>
    </radialGradient>

    <clipPath id="portraitClip">
      <circle cx="145" cy="150" r="88"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="1200" height="300" fill="url(#background)"/>
  <ellipse cx="145" cy="150" rx="180" ry="180" fill="url(#glow)"/>
  <ellipse cx="1020" cy="150" rx="240" ry="200" fill="url(#glow)" opacity="0.45"/>

  <!-- Subtle decorative lines -->
  <path d="M0 18 H1200 M0 282 H1200"
        stroke="#C6A15B" stroke-opacity="0.18" stroke-width="1"/>

  <path d="M28 35 V265"
        stroke="url(#gold)" stroke-width="2" opacity="0.65"/>

  <!-- Portrait frame -->
  <circle cx="145" cy="150" r="96"
          fill="none" stroke="#C6A15B"
          stroke-opacity="0.22" stroke-width="1"/>

  <circle cx="145" cy="150" r="91"
          fill="#171512" stroke="url(#photoRing)" stroke-width="3"/>

  <!-- Photo: profile.jpg must be in the same assets folder -->
  <image
      xlink:href="profile.jpg"
      href="profile.jpg"
      x="57" y="62"
      width="176" height="176"
      preserveAspectRatio="xMidYMid slice"
      clip-path="url(#portraitClip)"/>

  <!-- Inner portrait outline -->
  <circle cx="145" cy="150" r="88"
          fill="none" stroke="#F1D9A3"
          stroke-opacity="0.6" stroke-width="1"/>

  <!-- Small gold accents -->
  <circle cx="145" cy="47" r="3" fill="#E8CC91"/>
  <circle cx="145" cy="253" r="3" fill="#E8CC91"/>

  <!-- Name -->
  <text x="270" y="91"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="39"
        font-weight="bold"
        letter-spacing="0.2"
        fill="#F4E9D1">Bhavya Nawani</text>

  <!-- Name underline accent -->
  <path d="M272 105 H355"
        stroke="url(#gold)" stroke-width="2"/>

  <!-- EXACT SPECIALTY LINE -->
  <text x="272" y="132"
        font-family="Arial, Helvetica, sans-serif"
        font-size="14"
        font-weight="600"
        letter-spacing="1.1"
        fill="#D8BD83">PERFORMANCE MARKETING · SEO · SOCIAL MEDIA</text>

  <!-- Tagline -->
  <text x="272" y="174"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="21"
        font-style="italic"
        fill="#F0E8D9">Where Strategy Meets</text>

  <text x="272" y="201"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="21"
        font-style="italic"
        fill="#F0E8D9">Measurable Growth.</text>

  <!-- Supporting detail -->
  <text x="273" y="235"
        font-family="Arial, Helvetica, sans-serif"
        font-size="10"
        letter-spacing="2"
        fill="#9D9688">DATA-DRIVEN THINKING  ·  CREATIVE EXECUTION</text>

  <!-- Vertical divider -->
  <path d="M750 48 V252"
        stroke="#C6A15B" stroke-opacity="0.55" stroke-width="1"/>

  <!-- RIGHT PANEL: PERFORMANCE MARKETING -->
  <g transform="translate(812 82)"
     fill="none" stroke="url(#gold)"
     stroke-width="2" stroke-linecap="round"
     stroke-linejoin="round">

    <rect x="-22" y="-24" width="44" height="44"
          rx="10" stroke-opacity="0.6"/>

    <path d="M-12 10 V0 H-5 V10
             M-2 10 V-8 H5 V10
             M8 10 V-15 H15 V10"/>

    <path d="M-13 -13 L-4 -18 L3 -12 L14 -20"
          stroke-width="1.6"/>
  </g>

  <text x="812" y="128"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="10"
        font-weight="600"
        letter-spacing="0.6"
        fill="#E7D4AA">PERFORMANCE</text>

  <text x="812" y="143"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="10"
        font-weight="600"
        letter-spacing="0.6"
        fill="#E7D4AA">MARKETING</text>

  <!-- SEO -->
  <g transform="translate(970 82)"
     fill="none" stroke="url(#gold)"
     stroke-width="2" stroke-linecap="round"
     stroke-linejoin="round">

    <rect x="-22" y="-24" width="44" height="44"
          rx="10" stroke-opacity="0.6"/>

    <circle cx="-3" cy="-4" r="10"/>
    <path d="M4 3 L13 12"/>
    <path d="M-8 -4 H2 M-3 -9 V1"
          stroke-width="1.4" opacity="0.75"/>
  </g>

  <text x="970" y="136"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="11"
        font-weight="600"
        letter-spacing="1.4"
        fill="#E7D4AA">SEO</text>

  <!-- SOCIAL MEDIA -->
  <g transform="translate(1128 82)"
     fill="none" stroke="url(#gold)"
     stroke-width="2" stroke-linecap="round"
     stroke-linejoin="round">

    <rect x="-22" y="-24" width="44" height="44"
          rx="10" stroke-opacity="0.6"/>

    <path d="M-9 -9 L8 -14
             M-9 -9 L-8 9
             M-8 9 L9 10"/>

    <circle cx="-11" cy="-10" r="4" fill="#1A1814"/>
    <circle cx="11" cy="-15" r="4" fill="#1A1814"/>
    <circle cx="-8" cy="12" r="4" fill="#1A1814"/>
    <circle cx="12" cy="10" r="4" fill="#1A1814"/>
  </g>

  <text x="1128" y="136"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="10"
        font-weight="600"
        letter-spacing="0.8"
        fill="#E7D4AA">SOCIAL</text>

  <text x="1128" y="151"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="10"
        font-weight="600"
        letter-spacing="0.8"
        fill="#E7D4AA">MEDIA</text>

  <!-- Bottom right detail -->
  <path d="M790 190 H1160"
        stroke="#C6A15B" stroke-opacity="0.25" stroke-width="1"/>

  <text x="975" y="215"
        text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="11"
        font-style="italic"
        letter-spacing="0.7"
        fill="#B9AD96">Strategy. Visibility. Growth.</text>

  <!-- Corner details -->
  <path d="M1170 35 H1182 V47"
        fill="none" stroke="#C6A15B" stroke-opacity="0.7"/>

  <path d="M1170 265 H1182 V253"
        fill="none" stroke="#C6A15B" stroke-opacity="0.7"/>

</svg>
